<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reading Book</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>阅读器</h1>
          <p id="file-help">支持 UTF-8 编码的 TXT 文件，最大 5 MB。</p>
        </div>
        <label for="book-file">导入 TXT</label>
        <input id="book-file" type="file" accept=".txt,text/plain" aria-describedby="file-help">
      </header>
      <p id="status" role="status" aria-live="polite"></p>
      <article aria-labelledby="book-title">
        <h2 id="book-title">还没有打开书籍</h2>
        <p id="book-text">选择一个 TXT 文件，开始阅读。</p>
      </article>
    </main>
    <script type="module" src="./main.js"></script>
  </body>
</html>
